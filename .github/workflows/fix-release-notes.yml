name: Fix release notes

on:
  push:
    branches: [cleanup/attribution-80ddkw]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Rename the PR #3 line in the v0.1.0 notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.0 --json body --jq .body > notes.md
          sed -i 's|^\* Claude/project thread xpao5m by|* Project setup by|' notes.md
          grep -n 'pull/3' notes.md
          gh release edit v0.1.0 --notes-file notes.md
